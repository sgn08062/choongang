<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            border: 1px solid #777;
            text-align: center;
            letter-spacing: 10px;
        }

        /* 수직 정렬은 기준이 될 대상에 들어간다. */
        .box1 > img{
            vertical-align: middle;
        }
        .box2 {
            border: 1px solid #777;
            height: 100px;
            line-height: 100px;
            text-align: center;
        }
    </style>
</head>
<body>
    <p>hello world!</p>

    <a href="#" style="text-decoration: none;">나니가스키</a>

    <p class="box1">
        vertical align
        <img src="img/css3.png">
    </p>

    <div class="box2">
        고생하셨소!
    </div>
</body>
</html>
