<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = parseFloat(prompt("숫자를 입력하세요"));

        if (a<0){
            document.write("음수입니다.");
        }else if(a == 0){
            document.write("0");
        }else{
            if(a%2 == 0) document.write("짝수");
            else document.write("홀수");
        }
    </script>
</body>
</html>
