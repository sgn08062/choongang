<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        li, ul{
            list-style: none;
            padding: 0;
            margin: 0;;
        }
        li{
            display: inline-block;
        }
    </style>
</head>
<body>
    <ul>
        <li><img src="../img/1.jpg" width="100"></li>
        <li><img src="../img/2.jpg" width="100"></li>
        <li><img src="../img/3.jpg" width="100"></li>
        <li><img src="../img/4.jpg" width="100"></li>
    </ul>

    결과:
    <div>
        <img src="../img/1.jpg" alt="결과" width="200">
    </div>

    <script>
        let p = document.querySelector("ul");
        let img = document.querySelector("div > img");
        p.addEventListener("click", (e) => {
            console.log(e.target);
            if(e.target.tagName !== "IMG") return;
            img.src = e.target.src;
        })
    </script>
</body>
</html>
