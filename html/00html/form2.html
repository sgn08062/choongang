<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>폼에서 활용하는 다양한 속성</h3>
    <!-- 이런 속성이나 태그들은, 검색을 통해서 확인하는 편이 좋다! -->
    <form action="$$$$$">
        <fieldset>
            <legend>입력양식에 힌트를 줄때 사용</legend>
            
            <fieldset>
                <legend>중첩</legend>
            </fieldset>

            <!-- label 태그는 input과 연결되서 웹 접근성향상을 위해 사용될 수 있음-->
            <!-- required는 값을 필수로 지정해야하는 속성이다.-->
            <label for="a"></label>아이디</label>
            <input type="text" id="a" placeholder="아이디 입력하라고" required>
            <br>

            <!-- pattern은 정규표현식 문법을 사용해서, 특정 값만 입력받게 됨
                 title은 pattern과 함께 사용되고, 형식에 실패했을 때 부가적인 설명을 적습니다.
            -->
            <label for="b">전화번호</label>
            <input type="text" id="b" pattern="\d{3}-\d{4}-\d{4}" title="휴대전화는 010-0000-0000 형식이여야 합니다.">
            <br>
            <label for="c">동의 안해? 그럼 죽어</label>
            <!-- checked는 체크박스에 미리 체크하는 속성이다.-->
            <input type="checkbox" id="c" required checked>
            <br>
            <input type="submit" value="submit">
            
        </fieldset>
    </form>
</body>
</html>
