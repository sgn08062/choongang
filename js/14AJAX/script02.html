<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        fetch("hello.txt")
        .then((result) => {
            result.text().then(function(data){
                console.log(data);
            })
        })
        
        /*
        fetch를 호출시 프로미스 객체를 받음
        - fulfilled : 실행성공
        - pending: 대기중
        - rejected: 실패
        
        fetch("주소") => 프로미스 객체 반환
        */ 

        /*
        let promise = fetch("hello.txt");
        console.log(promise);
        promise.then((data) => {
            console.log(data); // response
        })
        */

        // 위를 줄여쓰면
        console.log(1);
        fetch("hello.txt")
        .then((data) => { // data가 promise 객체
            if(data.status === 200){
                console.log("성공에 대한 처리");
            }
            data.text().then((data) => {
                console.log(data);
            })
        })
        console.log(3);
        // fetch는 비동기적으로 동작한다.

        fetch("hello.txt")
        .then(response => response.text())
        .then(data => console.log(data))
        .catch(error => console.log("error:", error)) // catch는 생략가능
    </script>
</body>
</html>
