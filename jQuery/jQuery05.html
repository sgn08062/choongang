<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-3.7.1.min.js"></script>

    <style>
        .btn .active {color: red;}
    </style>
</head>
<body>
    <button type="button" id="btn" class="btn">버튼</button>

    <hr>
    <button type="button" id="demo">demo 버튼</button>
    <div class="item">
        클래스 추가하기
    </div>

    <script>
        // 추가
        //$("#btn").addClass("active");
        // 삭제
        //$("#btn").removeClass("active");

        $("#btn").click((e) =>{
            $(e.target).toggleClass("active");
        })
        // 확인
        console.log($("#btn").hasClass("btn")); // btn 클래스가 있으면 true, 없으면 false
        

        // demo 버튼 클릭하면 item 태그의 active 클래스를 토글 형식으로 동작
        $("#demo").click(() => {
            let item = $(".item");
            item.toggleClass("active");
            console.log(item.attr("class"));
            
        })
    </script>
</body>
</html>
