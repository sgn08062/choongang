<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p {
            border: thin solid black; /* 두께 스타일 색상 */
            border-radius: 100px; /* 하나만 쓰면 4각형 전부, 4개를 쓰면 좌측 상단부터 시계방향으로 적용 */
            
        }
    </style>
</head>
<body>
    <p>윤곽은 border 속성에 한번에 기술합니다.</p>
</body>
</html>
