spring.application.name=spring_boot_demo
# ???, ???? devtools??? ??? ??
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

server.port=8181
# jsp? ?? ?? ???
#spring.mvc.view.prefix=/WEB-INF/views/
#spring.mvc.view.suffix=.jsp

# DATABASE CONNECT
#spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=SPRING
spring.datasource.password=SPRING

# Underbar to Carmel Mapping
mybatis.configuration.map-underscore-to-camel-case=true
# SQL mapper Location
mybatis.mapper-locations=classpath:/mapper/**/*.xml
# package name as alias
mybatis.type-aliases-package=com.example.basic.chap04, com.example.basic.chap05