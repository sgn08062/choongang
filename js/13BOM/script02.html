<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" id="btn">인터벌중단</button>
    <script>
        let count=0;
        let btn = document.getElementById("btn")
        let stop = setInterval(function(){
            count++;
            console.log(count);
        }, 1000);

        btn.onclick = () => {
            clearInterval(stop);
        }
        // 타임아웃
        let stop2 = setTimeout(function(){
            alert("5초 뒤에 펑");
        }, 5000);
        
    </script>
</body>
</html>
