<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구구단</title>
</head>
<body>
    <script>
        let num = parseInt(prompt("구구단 숫자를 입력하세요"));

        // 제목 출력
        document.write("<h1>" + num + "단</h1>");

        // 구구단 출력
        let i = 1;
        while(i <= 9){
            // document.write(num + " x " + i + " = " + (num * i) + "<br>"); 
            // ES6 - 백틱
            document.write(`${num} x ${i} = ${num*i}<br>`);
            i++;
        }
    </script>
</body>
</html>
