<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{background-color: yellow; padding: 10px; margin: 10px;}
        .box .item{ background-color: green; width: 50px; height: 50px; margin: 10px;}
        /* 컨테이너 박스의 배치 유형 */
        .container{
            display: flex;
            /*
                direction에 따라서 justify content는 정렬축이 바뀜 
                flex-direction: column;
                height: 300px; 
            */
            justify-content: flex-start;
            justify-content: flex-end;
            justify-content: center;
            justify-content: space-between; /* 양끝을 붙이고 나머지 균등분배*/
            justify-content: space-around; /* 아이템의 모든 부분을 균등분배*/
        }

    </style>
</head>
<body>
    <h3>justify content (주축 정렬 - 축은 direction에 의해 결정)</h3>
    <div class="container box">
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
    </div>

    <hr>
    <h3>align-items (반대축 정렬 - 한줄정렬)</h3>
    <div class="container2 box">
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
    </div>

    <style>
        .container2{
            display: flex;
            height: 200px;
            flex-wrap: wrap;
            align-items: stretch;
            align-items: flex-start;
            align-items: flex-end;
            align-items: center;
            align-items: baseline;
        }
    </style>

    <h3>align-content(반대축 정렬 - 여러줄에 대한)</h3>
    <div class="container3 box">
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
    </div>

    <style>
        .container3{
            display: flex;
            flex-wrap: wrap;
            height: 200px;

            align-content: space-around;
        }
    </style>
</body>
</html>
