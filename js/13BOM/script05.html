<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 사용자의 브라우저 정보
        console.log(navigator.userAgent);

        // 위치정보 받기
        //navigator.geolocation.getCurrentPosition(성공결과를 받을 함수, 실패결과를 받을 함수);
        function success(result){
            console.log(result); // 성공 시에 동작함
        }

        function fail(result){
            console.log(result); // 실패 시에 동작함
        }
        navigator.geolocation.getCurrentPosition(success, fail)
    </script>
</body>
</html>
