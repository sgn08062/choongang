<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>innerHTML vs textContent<h3>

    <button type="button" id="btn">제목바꾸기 버튼</button>
    <h3 class="title">기본제목</h3>

    <script>
        // 버튼을 누르면 제목을 바꾼다.
        //버튼에 이벤트를 걸어 -> 이벤트 안에서 h3 태그를 얻음 -> 값을 바꿈
        let btn = document.getElementById("btn");
        let title = document.querySelector(".title")
        btn.addEventListener("click", function() {
            console.log(title.innerHTML);

            <!-- title.innerHTML = "<b>아ㅏ아아아아ㅏ아ㅏ아앙</b>"; --> //문자열이 태그로 인식된다.
            title.textContent = "<b>아ㅏ아아아아ㅏ아ㅏ아앙</b>"; // 순수한 문자열의 형태로 인식된다.
        })
    </script>
</body>
</html>
