<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>css선택자 문법으로 엘리먼트 선택</h3>

    <ul class="box">
        <li>안녕하세요</li>
        <li>안녕하셔</li>
        <li>안녕</li>
    </ul>

    <hr>

    <h3>DOM 탐색을 선택적으로 하는 방법</h3>

    <div class="wrap">
        <select class="sel">
            <option>사과</option>
            <option>딸기</option>
            <option>멜론</option>
        </select>
    </div>

    <script>
        // 최초로 발견되는 태그 1개 선택
        let li = document.querySelector(".box > li");
        console.log(li);

        // 이름에 해당되는 태그 배열로 반환
        let lis = document.querySelectorAll(".box > li")
        console.log(lis);

        let wrap = document.querySelector(".wrap");
        let options = wrap.querySelectorAll(".sel > option");
    </script>
</body>
</html>
