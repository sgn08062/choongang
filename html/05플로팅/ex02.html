            width: 16.6666%;
            float: left;
            box-sizing: border-box;
        }

</head>

        <div class="item">박스4</div>
        <div class="item">박스5</div>
        <div class="item">박스6</div>
        <div class="item">박스7</div>
        <div class="item">박스8</div>
        <div class="item">박스9</div>
        <div class="item">박스10</div>
        <div class="item">박스11</div>
        <div class="item">박스12</div>
    </div>
</body>
</html>
