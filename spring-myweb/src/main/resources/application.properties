spring.application.name=spring-myweb


server.port=8282

# database option
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mysql://localhost:3306/spring?serverTimezone=Asia/Seoul
spring.datasource.username=spring
spring.datasource.password=spring

# SQL mapper Location
mybatis.mapper-locations=classpath:/mapper/**/*.xml
# package name as alias
mybatis.type-aliases-package=com.sgn08062.spring_myweb.command, com.sgn08062.spring_myweb.util
# underbar To Carmel
mybatis.configuration.map-underscore-to-camel-case=true

############### file upload option
#file upload True of False
spring.servlet.multipart.enabled=true
#Maximum upload capacity at a time
spring.servlet.multipart.max-request-size=50MB
#Maximum size per file
spring.servlet.multipart.max-file-size=10MB
#Temporary storage path for upload files (set up x)
# spring.servlet.multipart.location=??? ??? ??
#Actual storage path
project.upload.path=C:/Users/user/Desktop/course/upload