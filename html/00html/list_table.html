<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>목록태그</h3>

    <ul>
        <li>수박</li>
        <li>멜론</li>
        <li>사과</li>
        <li>배</li>
        <li>딸기</li>
    </ul>

    <ol>
        <li>춥다</li>
        <li>덥다</li>
        <li>배고프다</li>
    </ol>

    <h3>테이블 태그</h3>
    <table border="5">
        
        <thead> <!-- 기능은 없지만 의미 부여 -->
            <tr>
                <!-- tr 태그로 사용해도 무방하다 -->
                <th>번호</th> <!-- 1열 -->
                <th>이름</th> <!-- 2열 -->
                <th>주소</th> <!-- 3열 -->
                <th>비고</th> <!-- 4열 -->
            </tr>
        </thead>
        <tbody> <!-- thead와 마찬가지 -->
            <tr>
                <td>1</td>
                <td>홍길동</td>
                <td>서울시 경복궁</td>
                <td rowspan="2">학생</td>
            </tr>
            <tr>
                <td>2</td>
                <td>김첨지</td>
                <td>경성</td>
            </tr>
            <tr>
                <td>3</td>
                <td>박명수</td>
                <td>군포</td>
            </tr>
            <tr>
                <!-- 열을 합치고 싶을 땐 colspan을 사용 -->
                <td colspan="2">결과</td>
                <td>찍고!</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
