<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{padding: 0; margin: 0;}
        .box{
            width: 500px;
            border: 1px solid #777;
            margin: 0 auto; 
            padding: 10px;
            position: relative;
        }
        .profile{
            position: absolute;
            left: 30px;
            top: 30px;
            width: 50px;
        }
        .content{
            padding-left: 80px;
        }
        .content > textarea{
            width: 100%;
            padding: 15px;
            font-size: 30px;
            box-sizing: border-box;
            min-height: 150px; /* 최소 높이 150px, 컨텐츠가 그 이상 차면 가변적으로 늘어남*/
        }
        .control{ overflow: hidden;}
        .left{ float: left;}
        .left > input{display: block;}
        .right{ float: right;}
    </style>
</head>
<body>
    <div class="box">
        <img class="profile" src="img/css3.png" alt="프로필">
        <div class="content">
            <textarea></textarea>
            <div class="control">
                <div class="left">
                    <input type="text">
                    <input type="text" style="margin-top: 5px;">
                </div>
                <button class="right">등록버튼</button>
            </div> 
        </div>
    </div>

    <div class="box">
        <img class="profile" src="img/css3.png" alt="프로필">
        <div class="content">
            <div class="control">
                <div class="left">
                    <h3>제목</h3>
                    <p>내용</p>
                </div>
                <button class="right">수정</button>
                <button class="right">삭제</button>
            </div>
            
        </div>
    </div>
</body>
</html>
