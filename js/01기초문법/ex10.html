<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let point = parseInt(prompt("정수를 입력하세요"));

        if(point >= 90){
            document.write("A학점");
        }else if(point >= 80){
            document.write("B학점");
        }else if(point >= 70){
            document.write("C학점");
        }else if(point >= 80){
            document.write("D학점");
        }else{
            document.write("F학점");
        }
    </script>
</body>
</html>
