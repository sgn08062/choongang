<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ex01</title>
</head>
<body>
    <h1>타임리프 문법 if문</h1>
<!--   타임리프 문법을 사용하고 싶으면, 속성 앞에 th:를 붙임 -->
    <p th:text="${'출력문!!!'}"></p>
    <p>[[${'태그 사이에서 출력!!!'}]]</p>
    <p>[[${1 == 1}]]</p>
    <p>[[${1 eq 1}]]</p>

    <p>[[${true && false}]]</p>
    <p>[[${true and false}]]</p>

    <p>[[${true || false}]]</p>
    <p>[[${true or false}]]</p>

    <p>[[${!true}]]</p>
    <p>[[${not true}]]</p>


    <h1>타임리프 변수 선언</h1>
    <div th:with="a = 10">
        [[${a}]]
    </div>

    <h1>if~else(unless)</h1>
    <div th:with="a=10">
        <span th:if="${a==10}">if문 실행됨</span>
        <span th:unless="${a==10}">else문 실행됨</span> <!-- unless는 해당 조건이 아닐때 발생-->
    </div>

    <h1>삼항 연산자</h1>
    <div th:with="a='홍길동'">
        [[${a=='홍길동'? '예':'아니오'}]]
    </div>
</body>
</html>
