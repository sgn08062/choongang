<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>모든 인풋은 라벨 + id속성을 활용해 보세요!</h1>
    <form>
        <fieldset>
            <legend>가입 양식</legend>
            <fieldset>
                <legend>개인 정보</legend>
                <label for="phonenumber">전화번호</label><br>
                <input type="text" id="phonenumber" pattern="\d{11}" placeholder="예)01012341234" required><br>
                <br>
                <label for="birthday">생년월일</label><br>
                <input type="date" id="birthday">
                <br>
                <p></p>
            </fieldset>
            <fieldset>
                <legend>이용 약관</legend>
                <p>회원가입을 위해 서비스 이용 약관 및 개인정보 처리방침에 동의해주세요.</p>
                
                <input type="checkbox" id="agree" required>
                <label for="agree">약관 및 개인정보 처리방침에 동의합니다.</label> 
            </fieldset>
            <br>
            <input type="submit" value="가입하기" id="register">
        </fieldset>
    </form>
</body>
</html>
