<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>input은 지우는게 아니라 display를 제어</h2>
    <hr>
    <h2>할일 목록 만들기</h2>
    <h2>confirm("메시지")확인 클릭시 true반환, 취소 클릭시 false 반환</h2>
    <div id="in">
        <input type="text" class="name" placeholder="당신의 이름을 적으세요">
        <h3 class="hello" style="display: none"></h3>
        <button type="button" class="nameBtn">확인</button>
    </div>
    <div id="todo">
        <input type="text" class="work" placeholder="당신의 할일을 적으세요">
        <button type="button" class="todoBtn">확인</button>
        <ul id="box">

        </ul>
    </div>

    <script>
        // 이름 작성
        let name = document.querySelector(".name");
        let hello = document.querySelector(".hello");
        let nameBtn = document.querySelector(".nameBtn");

        nameBtn.addEventListener("click", () => {
            let n = name.value;
            hello.innerHTML = n + "님 안녕하세요";
            hello.style.display = "block"
            name.style.display = "none";
            nameBtn.style.display = "none"
        })

        // ToDo  리스트
        let todoBtn = document.querySelector(".todoBtn");
        let box = document.querySelector("#box");
        let work = document.querySelector(".work");

        todoBtn.addEventListener("click", () => {
            let li = document.createElement("li");
            let div = document.createElement("div");
            let btn = document.createElement("button");
            let up = document.createElement("button");
            let down = document.createElement("button");

            // 1. 할 일을 적었는지 체크하고
            if(work.value.length === 0) {
                alert("할 일을 작성해주세요!!");
                return;
            }

            // 2. 각 태그에 이너값, 클래스명을 추가하고 부모상자에 넣기
            btn.innerHTML = "X";
            up.innerHTML = "↑";
            down.innerHTML = "↓";
            li.innerHTML = work.value;
            li.appendChild(btn);
            li.appendChild(up);
            li.appendChild(down);
            box.appendChild(li);

            btn.addEventListener("click", function(){
                if(confirm("정말 삭제하시겠습니까?") == true){
                    let current = this.parentElement;
                    current.remove()
                }else{
                    return false;
                }
            })

            up.addEventListener("click", function() {
                let current = this.parentElement;
                let prev = current.previousElementSibling;

                if(prev === null){
                    alert("첫번째 행입니다");
                    return false;
                }
                box.insertBefore(current, prev);
            });

            down.addEventListener("click", function() {
                let current = this.parentElement;
                let next = current.nextElementSibling;
                
                if(next === null){
                    alert("마지막 행입니다");
                    return false;
                }
                box.insertBefore(next, current);
            })

            // 할 일 input에 값은 초기화
            work.value = "";
        })
    </script>
</body>
</html>
