<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{padding: 0; margin: 0; }
        ul, li{ list-style: none;}
        a{text-decoration: none;}
        #header{
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            background-color: white;
            z-index: 5;
        }
        .logo{
            text-align: center;
            padding: 10px 0;
        }
        .logo > img{
            width: 100px;
        }
        .gnb { background-color: rgb(72, 255, 0); text-align: center;}
        .gnb > ul > li {display: inline-block;}
        .gnb > ul > li > a{
            display: block; /*크기 지정 가능 */
            padding: 10px 20px;
        } 
        .gnb > ul > li > a:hover{
            background-color: rgb(255, 0, 128);
        }
        #section{ 
            background-color: aqua; 
            height: 1000px;
            margin-top: 168px;
        }
        .action-btn{
            position: fixed;
            right: 10px;
            top: 10px;
            z-index: 10;
        }
        .stic{
            position: sticky;
            left: 0;
            top:168px;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="action-btn">TOP</div> 
    <header id="header">
        <div class="logo">
            <img src="img/css3.png" alt="logo">
        </div>
        <nav class="gnb">
            <ul>
                <li><a href="#">메뉴</a></li>
                <li><a href="#">메뉴</a></li>
                <li><a href="#">메뉴</a></li>
                <li><a href="#">메뉴</a></li>
            </ul>
        </nav>
    </header>
    
 
    <section id="section">
        <p>내요요요용</p>
    </section>

    <!-- 
        sticky는 스크롤을 따라다니다가 특정 높이에서 fixed되는 속성
        1. top 속성에 fixed되는 위치를 지정합니다.
        2. 부모님 속성에 overflow가 있으면 안된다.
    -->
    <div class="stic">포지션 sticky</div>

    <section id="section" style="margin: 0;">
        <p>내요요요용</p>
    </section>

</body>
</html>
