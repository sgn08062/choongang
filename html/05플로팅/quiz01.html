<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box1{
            border: 1px solid #777;
            overflow: hidden;
            width: 800px;
        }
        .pos3{
            float: left;
            width: 33.3333%;
            border: 1px solid #ff0000;
            box-sizing: border-box;
        }
        .box2{
            border: 1px solid #777;
            overflow: hidden;
            width: 50%;
        }
        .per50_1{
            float: left;
            border: 1px solid #877;
            width: 45%;
        }
        .per50_2{
            float: right;
            border: 1px solid #877;
            width: 45%;
        }
    </style>
</head>
<body>
    <div class="one">
        <h1>1. 너비는 800px에 3칸을 배치해보세요.</h1>
        <div class="box1">
            <div class="pos3">3칸 배치</div>
            <div class="pos3">3칸 배치</div>
            <div class="pos3">3칸 배치</div>
        </div>
    </div>
    <div class="two">
        <h1>2. 너비 50%에 두 상자를 양쪽으로 각각 배치해 보세요.</h1>
        <div class="box2">
            <div class="per50_1">너비: 45%</div>
            <div class="per50_2">너비: 45%</div>
        </div>
    </div>
</body>
</html>
