<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log("콘솔창으로의 출력입니다.");
        //alert("브라우저에 경고창 입니다");
        document.write("화면으로의 출력입니다.");

        // 세미콜론은 찍어도 되고, 안찍어도 되지만, 논리적인 구문 끝에는 반드시 찍도록 합니다.
        console.log("안녕하세요!!");
        console.log("두번째 출력 입니다");

        // 코드에서의 줄바꿈
        console.log("코드에서의 줄바꿈\n  \\n으로 표현합니다");

        // 여러 값을 하나의 출력문에 한번에 출력하고 싶은 경우
        console.log("여러 값을", "한번에", "출력하고 싶으면", "이렇게 할 수 있습니다.");
        console.log("여러 값을" + "한번에" + "출력하고 싶으면" + "이렇게 할 수 있습니다.");

        // 문자와 숫자
        console.log("1", 1);
    </script>
</body>
</html>
