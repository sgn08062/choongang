<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /*
            1. 사용자에게 바구니의 크기를 입력 받습니다.
            2. 그 다음에 사과의 개수를 입력 받습니다.
            3. 사과의 개수와, 필요한 바구니의 개수를 출력하면 된다.
            ex) 바구니 크기 = 10, 사과의 개수가 151개 이면 바구니는 16개가 필요
        */
        let backet = parseInt(prompt("바구니 하나에 담을 수 있는 바구니의 크기를 입력하세요"));
        let apple = parseInt(prompt("사과의 개수를 입력하세요"));
        let bCount = parseInt(apple/backet) + (apple%backet === 0 ? 0 : 1);
        document.write("필요한 바구니 개수: " + bCount  );
    </script>
</body>
</html>
