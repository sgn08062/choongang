<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 500px;
            border: 1px solid #772;
            background-image: url('img/배경이미지.jpg');
            background-repeat: no-repeat;
            background-size: cover;
        }

        .section {
            border: 2px solid #770;
            height: 700px;
            background-image: url(img/배경이미지.jpg);
            background-size: cover;
            background-attachment:fixed; /* scroll이 기본값 */
        }
    </style>
</head>
<body>
    <div class="box">

    </div>

    <section class="section">

    </section>

    <section style="height: 1000px;">

    </section>
</body>
</html>
