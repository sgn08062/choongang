<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 구조분해할당 - desctruction assignment
        let arr = ["홍", "김", "박"];
        let [a, b, c] = arr;

        let [n1, , n3] = arr; // n1="홍", n3="박"
        let [a1, ...x] = arr; // a1="홍", x=["김", "박"]

        // 객체에서 구조분해 할당
        let obj = {name: "홍길동", age: 20, address: "서울시"};
        let {name, address, age} = obj;
        console.log(name);
        console.log(address);
        console.log(age);
        
        // 다른 이름으로 변경해서 할당
        let{name: n, age: m, address: o} = obj;
        console.log(n, m, o);
        
        let list = [
            {id: 1, name: "홍길동", age: 20, info: {addr:"서울시"}},
            {id: 2, name: "김철수", age: 30, info: {addr:"부산시"}}
        ]
        // list 배열에서 0번째 객체의 info 안에 addr 값을 구조분해 할당
        let [{info: info1}] = list;
        console.log(info1); // {addr: "서울시"}
        let [{info: {addr: addr1}}] = list;
        console.log(addr1);

        let [, {info: info2}] = list;
        console.log(info2);
        let [, {info: {addr: addr2}}] = list;
        console.log(addr2);
        
        let {info: info3} = list[1];
        console.log(info3);
        

    </script>
</body>
</html>
